
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Special Birthday 🎂</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #05070d, #101827, #05070d);
            color: white;
            overflow: hidden;
        }

        /* STIKER LUCU */
        .sticker {
            position: absolute;
            font-size: 45px;
            animation: melayang 3s ease-in-out infinite;
        }

        .s1 {
            top: 8%;
            left: 10%;
        }

        .s2 {
            top: 15%;
            right: 10%;
            animation-delay: 1s;
        }

        .s3 {
            bottom: 12%;
            left: 12%;
            animation-delay: 2s;
        }

        .s4 {
            bottom: 10%;
            right: 12%;
            animation-delay: 1.5s;
        }

        @keyframes melayang {
            0%, 100% {
                transform: translateY(0) rotate(-5deg);
            }

            50% {
                transform: translateY(-20px) rotate(5deg);
            }
        }

        /* KARTU */
        .card {
            width: 90%;
            max-width: 500px;
            padding: 40px 30px;
            text-align: center;

            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 30px;

            backdrop-filter: blur(15px);

            box-shadow: 0 20px 60px rgba(0,0,0,0.6);

            position: relative;
            z-index: 5;
        }

        .emoji {
            font-size: 80px;
            animation: goyang 2s infinite;
            margin-bottom: 10px;
        }

        @keyframes goyang {
            0%,100% {
                transform: rotate(-5deg);
            }

            50% {
                transform: rotate(5deg);
            }
        }

        h1 {
            font-size: 38px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px #1769aa;
        }

        .subtitle {
            color: #9ccaff;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #dcecff;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 15px;
            border: 1px solid #5798d9;
            background: rgba(0,0,0,0.3);
            color: white;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            box-shadow: 0 0 15px rgba(87,152,217,0.5);
        }

        button {
            margin-top: 20px;
            padding: 14px 30px;
            border: 1px solid #5798d9;
            border-radius: 50px;

            background: linear-gradient(45deg, #174a7e, #2878b8);

            color: white;
            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.08);
            background: linear-gradient(45deg, #23669e, #3594d3);
        }

        #pesan {
            margin-top: 15px;
            color: #ff9da9;
            font-size: 14px;
        }

        .footer {
            margin-top: 25px;
            color: #8995a5;
            font-size: 13px;
        }

        /* BINTANG */
        .star {
            position: absolute;
            color: white;
            font-size: 18px;
            animation: jatuh 6s linear infinite;
        }

        @keyframes jatuh {
            from {
                transform: translateY(-100px);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            to {
                transform: translateY(110vh);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <!-- STIKER LUCU -->
    <div class="sticker s1">🎈</div>
    <div class="sticker s2">🎁</div>
    <div class="sticker s3">🧸</div>
    <div class="sticker s4">💗</div>

    <!-- BINTANG -->
    <div class="star" style="left:20%; animation-delay:1s;">✦</div>
    <div class="star" style="left:35%; animation-delay:3s;">✦</div>
    <div class="star" style="left:55%; animation-delay:0s;">✦</div>
    <div class="star" style="left:75%; animation-delay:2s;">✦</div>
    <div class="star" style="left:90%; animation-delay:4s;">✦</div>

    <!-- KARTU -->
    <div class="card">

        <div class="emoji">
            🎂
        </div>

        <h1>Hi, Birthday Boy! 🤍</h1>

        <p class="subtitle">
            Sebelum masuk, jawab satu pertanyaan kecil dulu... 
            <br>
            Kapan tanggal ulang tahun kamu? 👀🎁
        </p>

        <label for="tanggal">
            🎀 Masukkan tanggal ulang tahun
        </label>

        <input type="date" id="tanggal">

        <button onclick="cekTanggal()">
            💌 Buka Surprise
        </button>

        <p id="pesan"></p>

        <div class="footer">
            Ada sesuatu yang spesial menunggumu... ✨
        </div>

    </div>

    <script>

        function cekTanggal() {

            // GANTI TANGGAL DI SINI
            // Contoh: 19 september 2005
            const tanggalBenar = "2005-09-19";

            const tanggalInput = document.getElementById("tanggal").value;
            const pesan = document.getElementById("pesan");

            if (tanggalInput === "") {

                pesan.innerHTML = "Tanggalnya diisi dulu dong 😭🎂";

                return;
            }

            if (tanggalInput === tanggalBenar) {

                pesan.style.color = "#8cffc1";
                pesan.innerHTML = "Benar! Surprise-nya dibuka... 💗✨";

                setTimeout(function() {

                    window.location.href = "utama.html";

                }, 1000);

            } else {

                pesan.style.color = "#ff9da9";
                pesan.innerHTML = "Hmm... tanggalnya salah 😝 Coba ingat lagi! 🎂";

            }
        }

    </script>
    


</body>
</html>
